services:
  ssh-559.cyrhades.fr:
    container_name: ssh-559
    build:
      context: ./.docker/ssh
      args:
        LANGUAGE: ${LANGUAGE:-fr}
    labels:
      ho.ctf.cyrhades: "challenge"
      ho.ctf.cyrhades.webssh: "1"
    environment:
      SSH_HOSTNAME: "ssh-559.cyrhades.fr"
      SSH_PORT: 22
      SSH_USERNAME: "cyrhades"
      SSH_PASSWORD: "secret"
    restart: unless-stopped
  le-retour-de-jafar.cyrhades.fr:
    image: anssi/fcsc2025-crypto-le-retour-de-jafar:latest
